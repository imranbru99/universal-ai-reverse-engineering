apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverseforge-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reverseforge-web
  template:
    metadata:
      labels:
        app: reverseforge-web
    spec:
      containers:
        - name: web
          image: reverseforge/web:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: reverseforge-web
spec:
  selector:
    app: reverseforge-web
  ports:
    - port: 80
      targetPort: 3000
